    HOW TO ADD A NEW PHOTO:
    1. Put the photo file in the images/bowls/ folder.
    2. Copy one whole <figure>...</figure> block below and paste it just before </div>.
    3. Change the src="..." to your new file name.
    4. Change the text inside <figcaption> to describe the piece.
    See WEBSITE-GUIDE.md for the full step-by-step with git commands.
  -->
  <div class="photo-grid">
    <figure>
